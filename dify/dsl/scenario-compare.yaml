app:
  description: GTX FSO 场景对比——基线与急货插单各跑一次六步 MILP，LLM 输出差异分析与结论
  icon: 🔀
  icon_background: '#FFF7E6'
  mode: workflow
  name: gtx-scenario-compare
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: 内网穿透地址（cloudflared tunnel --url http://localhost:8000）
    id: env-api-base
    name: API_PUBLIC_BASE
    selector:
    - env
    - API_PUBLIC_BASE
    value: ''
    value_type: string
  features:
    file_upload:
      enabled: false
  graph:
    edges:
    - id: e1
      source: start
      target: call-baseline
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: http-request
    - id: e2
      source: call-baseline
      target: diff-llm
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
    - id: e3
      source: diff-llm
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables: []
      height: 90
      id: start
      position:
        x: 60
        y: 220
      positionAbsolute:
        x: 60
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 基线场景（case 留空）
        method: post
        selected: false
        title: 调用后端摘要接口
        timeout:
          connect: 10
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          read: 60
          write: 20
        type: http-request
        url: '{{#env.API_PUBLIC_BASE#}}/api/solve/compare-digest?case=urgent-A01'
        variables: []
        authorization:
          config: null
          type: no-auth
        body:
          data: '{"case": null}'
          type: json
        headers: ''
        params: ''
      height: 118
      id: call-baseline
      position:
        x: 360
        y: 120
      positionAbsolute:
        x: 360
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            max_tokens: 1024
            temperature: 0.3
          mode: chat
          name: gpt-4o-mini
          provider: openai_api_compatible
        prompt_template:
        - id: sys1
          role: system
          text: 你是光刻排程专家。对比基线与急货插单（urgent-A01）两次排程，输出中文差异分析：1) 两次 MILP 状态；2) 急货 LOT-A01
            开工与机台变化；3) MakeSpan 变化及原因；4) 开工时间变化的 Lot 逐条列出；5) 一句话结论（急货插单的代价）。250 字以内，用条目。
        - id: usr1
          role: user
          text: '{{#call-baseline.body#}}'
        selected: false
        title: 差异分析
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: diff-llm
      position:
        x: 1020
        y: 220
      positionAbsolute:
        x: 1020
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - diff-llm
          - text
          variable: comparison
        selected: false
        title: 结束
        type: end
        variables: []
      height: 90
      id: end
      position:
        x: 1340
        y: 220
      positionAbsolute:
        x: 1340
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
  viewport:
    x: 0
    y: 0
    zoom: 0.7
