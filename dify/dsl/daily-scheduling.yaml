app:
  description: GTX FSO 日计划排程编排——调本地六步 MILP 求解，解析结果后由 LLM 生成中文解读
  icon: 📈
  icon_background: '#E6F4FF'
  mode: workflow
  name: gtx-daily-scheduling
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: 内网穿透地址（cloudflared tunnel --url http://localhost:8000）
    id: env-api-base
    name: API_PUBLIC_BASE
    selector:
    - env
    - API_PUBLIC_BASE
    value: ''
    value_type: string
  features:
    file_upload:
      enabled: false
  graph:
    edges:
    - id: e1
      source: start
      target: callsolve
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: http-request
    - id: e2
      source: callsolve
      target: explain
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
    - id: e3
      source: explain
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
    nodes:
    - data:
        desc: 场景用例名可留空（基线）
        selected: false
        title: 开始
        type: start
        variables:
        - label: 场景用例名
          max_length: 48
          options: []
          required: false
          type: text-input
          variable: case
          default: ''
      height: 116
      id: start
      position:
        x: 60
        y: 200
      positionAbsolute:
        x: 60
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 调本地后端六步 MILP（子进程隔离，约 3~5s）
        method: post
        selected: false
        title: 调用后端摘要接口
        timeout:
          connect: 10
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          read: 60
          write: 20
        type: http-request
        url: '{{#env.API_PUBLIC_BASE#}}/api/solve/digest'
        variables: []
        authorization:
          config: null
          type: no-auth
        body:
          data: '{"case": "{{#start.case#}}"}'
          type: json
        headers: ''
        params: ''
      height: 118
      id: callsolve
      position:
        x: 380
        y: 200
      positionAbsolute:
        x: 380
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            max_tokens: 1024
            temperature: 0.3
          mode: chat
          name: gpt-4o-mini
          provider: openai_api_compatible
        prompt_template:
        - id: sys1
          role: system
          text: 你是光刻排程专家。基于给定字段输出中文解读，必须覆盖：1) MILP 求解状态；2) 急货 LOT-A01 上机时间与光罩就绪链路（IRIS
            20+搬送10+装载5=35min）；3) 机台负载分布；4) 卡控与校准事件逐条解释（QTMS 超水位/放货间隔/计片 IRIS/Chuck
            不相容）；5) 给计划员的两条可执行建议。300 字以内，用条目。
        - id: usr1
          role: user
          text: '{{#callsolve.body#}}'
        selected: false
        title: 排程中文解读
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: explain
      position:
        x: 1020
        y: 200
      positionAbsolute:
        x: 1020
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - explain
          - text
          variable: explanation
        selected: false
        title: 结束
        type: end
        variables: []
      height: 90
      id: end
      position:
        x: 1340
        y: 200
      positionAbsolute:
        x: 1340
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
  viewport:
    x: 0
    y: 0
    zoom: 0.7
