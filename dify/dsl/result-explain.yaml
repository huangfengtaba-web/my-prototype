app:
  description: GTX FSO 排程结果 AI 解读——按 run_id 取数，LLM 生成中文解读报告（/litho-schedule「AI 解读」按钮的线上模式）
  icon: 🧠
  icon_background: '#E6F4FF'
  mode: workflow
  name: gtx-result-explain
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: 内网穿透地址（cloudflared tunnel --url http://localhost:8000）
    id: env-api-base
    name: API_PUBLIC_BASE
    selector:
    - env
    - API_PUBLIC_BASE
    value: ''
    value_type: string
  features:
    file_upload:
      enabled: false
  graph:
    edges:
    - id: e1
      source: start
      target: fetch-result
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: http-request
    - id: e2
      source: fetch-result
      target: explain
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
    - id: e3
      source: explain
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
    nodes:
    - data:
        desc: 来自 /litho-schedule 或 /api/solve/list
        selected: false
        title: 开始
        type: start
        variables:
        - label: 求解运行 ID
          max_length: 32
          options: []
          required: true
          type: text-input
          variable: run_id
      height: 116
      id: start
      position:
        x: 60
        y: 200
      positionAbsolute:
        x: 60
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 回调本地后端取完整 run_summary
        method: get
        selected: false
        title: 调用后端摘要接口
        timeout:
          connect: 10
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          read: 30
          write: 10
        type: http-request
        url: '{{#env.API_PUBLIC_BASE#}}/api/solve/digest'
        variables: []
        authorization:
          config: null
          type: no-auth
        body:
          data: ''
          type: none
        headers: ''
        params: ''
      height: 90
      id: fetch-result
      position:
        x: 380
        y: 200
      positionAbsolute:
        x: 380
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            max_tokens: 1024
            temperature: 0.3
          mode: chat
          name: gpt-4o-mini
          provider: openai_api_compatible
        prompt_template:
        - id: sys1
          role: system
          text: 你是光刻排程专家。基于排程摘要输出中文解读，必须覆盖：1) MILP 求解状态；2) 急货 LOT-A01 上机时间与光罩就绪链路（IRIS
            20+搬送10+装载5=35min）；3) 机台负载分布；4) 卡控与校准事件逐条解释（QTMS 超水位/放货间隔/计片 IRIS/Chuck
            不相容）；5) 光罩温层跳变风险；6) 给计划员的两条可执行建议。300 字以内，用条目。
        - id: usr1
          role: user
          text: '{{#fetch-result.body#}}'
        selected: false
        title: 排程中文解读
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: explain
      position:
        x: 1020
        y: 200
      positionAbsolute:
        x: 1020
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - explain
          - text
          variable: explanation
        selected: false
        title: 结束
        type: end
        variables: []
      height: 90
      id: end
      position:
        x: 1340
        y: 200
      positionAbsolute:
        x: 1340
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
  viewport:
    x: 0
    y: 0
    zoom: 0.7
