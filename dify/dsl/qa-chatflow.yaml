app:
  description: GTX FSO 排程知识问答——知识库检索 + LLM 回答（排程规则/工艺/API 说明）
  icon: 💬
  icon_background: '#E6F4FF'
  mode: advanced-chat
  name: gtx-qa-chatflow
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: 如需回查本地数据接口则填内网穿透地址，纯 RAG 可留空
    id: env-api-base
    name: API_PUBLIC_BASE
    selector:
    - env
    - API_PUBLIC_BASE
    value: ''
    value_type: string
  features:
    opening_statement: 你好，我是 GTX 光刻排程知识助手。可以问我排程规则、QTime/BARC、光罩五态、Fix Lot 等问题。
    retriever_resource:
      enabled: true
    suggested_questions:
    - BARC 放货窗口怎么算？
    - 光罩 IRIS 和 StarLight 有什么区别？
    - Fix Lot 的作用是什么？
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: knowledge-retrieval
      id: e1
      source: start
      sourceHandle: source
      target: retrieval
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: e2
      source: retrieval
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: e3
      source: answer
      sourceHandle: source
      target: answernode
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: 用户问题
          max_length: 512
          options: []
          required: false
          type: text-input
          variable: query
      height: 116
      id: start
      position:
        x: 60
        y: 220
      positionAbsolute:
        x: 60
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids: []
        desc: 导入后在此绑定知识库（docs/specs 全部 md + docs/03_ALGORITHM_DEMO.md）
        multiple_retrieval_config:
          reranking_enable: false
          score_threshold: 0.5
          top_k: 4
        query_variable_selector:
        - sys
        - query
        retrieval_mode: multiple
        selected: false
        title: 排程知识库检索
        type: knowledge-retrieval
      height: 122
      id: retrieval
      position:
        x: 360
        y: 220
      positionAbsolute:
        x: 360
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - retrieval
          - result
        desc: ''
        model:
          completion_params:
            max_tokens: 1024
            temperature: 0.3
          mode: chat
          name: gpt-4o-mini
          provider: openai_api_compatible
        prompt_template:
        - id: sys1
          role: system
          text: 你是 GTX 光刻排程系统的知识助手。只依据检索到的知识片段回答；检索不到就直说不知道并指引查阅 docs/ 目录。回答需给出依据出处文件名。中文，300
            字以内。
        - id: usr1
          role: user
          text: 问题：{{#sys.query#}}
        selected: false
        title: 知识问答
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: answer
      position:
        x: 700
        y: 220
      positionAbsolute:
        x: 700
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#answer.text#}}'
        desc: ''
        selected: false
        title: 直接回复
        type: answer
        variables: []
      height: 90
      id: answernode
      position:
        x: 1020
        y: 220
      positionAbsolute:
        x: 1020
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
  viewport:
    x: 0
    y: 0
    zoom: 0.7
