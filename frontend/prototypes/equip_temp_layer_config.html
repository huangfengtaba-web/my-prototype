<style>

}

.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* comment mode */
.q{display:none;width:15px;height:15px;border-radius:50%;background:var(--colorWarning);color:#fff;font-size:11px;line-height:15px;text-align:center;cursor:pointer;margin-left:4px;font-weight:700;vertical-align:middle;user-select:none}
body.cmt-on .q{display:inline-block}
.bubble{position:fixed;z-index:1000;max-width:300px;background:#fff;border-radius:var(--radiusLG);box-shadow:var(--shadow);padding:12px 14px;font-size:13px;color:var(--colorText);border-top:3px solid var(--colorWarning)}

</style>

<script>
/* ================= 数据 ================= */
const D = {
  sync:{last:'2026-10-19 14:25:03', auto:'每 5 min', src:'EAP / MES'},
  equips:[
    {eqp:'SC01', cap:'Capability1', recipes:['RCP_A','RCP_B','RCP_C'], temp:23, src:'EAP'},
    {eqp:'SC02', cap:'Capability1', recipes:['RCP_A','RCP_C'],        temp:23, src:'EAP'},
    {eqp:'SC03', cap:'Capability2', recipes:['RCP_B','RCP_D'],        temp:35, src:'MES'},
    {eqp:'SC04', cap:'Capability1', recipes:['RCP_A','RCP_B','RCP_C*','RCP_D'], temp:28, src:'EAP'},
    {eqp:'SC05', cap:'Capability3', recipes:['RCP_C'],               temp:28, src:'MES'},
    {eqp:'SC06', cap:'Capability2', recipes:['RCP_A','RCP_D'],        temp:35, src:'EAP'},
    {eqp:'SC07', cap:'Capability3', recipes:['RCP_B'],               temp:23, src:'EAP'},
  ],
  // Capability 主数据（来自其他系统，作为下拉可配置值）
  capMaster:['Capability1','Capability2','Capability3','Capability4','Capability5','Capability6'],
  caps:[
    {cap:'Capability1', start:90,  end:110, cost:120, ut:'2026-10-18 14:20', uu:'huangjw'},
    {cap:'Capability2', start:100, end:120, cost:150, ut:'2026-10-17 09:05', uu:'zhangq'},
    {cap:'Capability3', start:80,  end:95,  cost:90,  ut:'2026-10-15 18:42', uu:'liwei'},
    {cap:'Capability4', start:105, end:125, cost:140, ut:'2026-10-16 11:30', uu:'wangl'},
  ],
};
const PAGE_SIZE = 8;
const state = {tab:'display', cmt:false, kw:'', fCap:'', tMin:'', tMax:'', fCfgCap:'', page:1, dirty:{}, editingKey:null};

/* ================= 工具 ================= */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const capOf = eqp => (D.equips.find(e=>e.eqp===eqp)||{}).cap || 'Capability1';
function toast(msg, isErr){
  const el=document.createElement('div');
  el.className='toast'+(isErr?' err':'');
  el.innerHTML=(isErr?'⚠️':'✅')+' <span>'+esc(msg)+'</span>';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}
function now(){const d=new Date();const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
const curUser='huangjw';
function tip(txt){return '<span class="q" data-tip="'+esc(txt).replace(/"/g,'&quot;')+'">?</span>';}
function tempVisual(t){
  const cls = t>=35?'hot':(t>=28?'warm':'');
  const pct = Math.min(100, Math.max(8, Math.round((t-15)/(45-15)*100)));
  return '<span class="temp"><span class="bar '+cls+'"><i style="width:'+pct+'%"></i></span>'+t+' <em>℃</em></span>';
}
function syncCapsFromEquip(){
  // Capability 与设备数量的关联展示用（Capability 配置里展示覆盖设备数）
  return D.equips.map(e=>capOf(e.eqp));
}

/* ================= 通配符匹配（RECIPE_ID_LIST 搜索） ================= */
// 仅当关键字含 * 时按 glob 通配：* 转 .*，并自动锚定首尾；其余字符做正则转义。
function buildRe(kw){
  if(!kw || !kw.includes('*')) return null;
  const esc = kw.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*');
  try { return new RegExp('^'+esc+'$', 'i'); } catch(e){ return null; }
}
// 命中关键字时，返回高亮后的 Recipe 文本（仅高亮匹配子串）
function hlRecipe(r, re){
  if(!re) return esc(r);
  const m = re.exec(r);
  if(!m) return esc(r);
  const s=m.index, e=m.index+m[0].length;
  return esc(r.slice(0,s))+'<mark class="hl">'+esc(r.slice(s,e))+'</mark>'+esc(r.slice(e));
}

/* ================= 渲染：外框 ================= */
function render(){
  $('#content').innerHTML = `
    <div class="card np">
      <div style="padding:0 24px">
        <div class="tabs">
          <div class="tab ${state.tab==='display'?'on':''}" onclick="switchTab('display')">设备温层展示<span class="cnt">${D.equips.length}</span></div>
          <div class="tab ${state.tab==='config'?'on':''}" onclick="switchTab('config')">Capability 温层配置<span class="cnt">${D.caps.length}</span></div>
        </div>
      </div>
      ${state.tab==='display' ? viewDisplay() : viewConfig()}
    </div>`;
  if(state.cmt) bindTips();
}

function switchTab(t){ state.tab=t; state.kw=''; state.fCap=''; state.tMin=''; state.tMax=''; state.fCfgCap=''; render(); }
function readDisp(){
  state.kw=($('#kwInput').value||'').trim();
  state.fCap=($('#dispCap_input').value||'').trim();
  state.tMin=($('#tMin').value||'').trim();
  state.tMax=($('#tMax').value||'').trim();
}
function queryDisp(){ readDisp(); state.page=1; render(); }
function resetDisp(){ state.kw=''; state.fCap=''; state.tMin=''; state.tMax=''; state.page=1; render(); }

/* ================= 视图 1：展示 ================= */
function viewDisplay(){
  const list = currentList();
  const re = buildRe(state.kw.trim());
  const total = list.length, maxPage=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(state.page>maxPage) state.page=maxPage;
  const rows = list.slice((state.page-1)*PAGE_SIZE, state.page*PAGE_SIZE);
  const kwTag = re ? `<span class="tag processing" style="margin-right:6px">通配 ${esc(state.kw.trim())}</span>` : '';

  return `
  <div style="padding:16px 24px 24px">
    <div class="toolbar">
      <input class="inp" id="kwInput" placeholder="搜索 EQUIP_ID / RECIPE_ID（支持 * 通配，如 RCP_A*）" value="${esc(state.kw)}">
      ${ssHTML('dispCap', state.fCap, D.capMaster, '全部 Capability')}
      <span style="display:inline-flex;align-items:center;gap:4px">温度

        <th>TEMPERATURE ${tip('设备温层当前温度（℃）。与 Capability 配置的温度区间比对，超出区间则不可排入。')}</th>

function currentList(){
  const kw=state.kw.trim();
  const re=buildRe(kw);
  const tMin=state.tMin==='' ? null : parseInt(state.tMin);
  const tMax=state.tMax==='' ? null : parseInt(state.tMax);
  return D.equips.filter(e=>{
    let hit;
    if(re){
      hit = re.test(e.eqp) || e.recipes.some(r=>re.test(r));
    } else {
      const l=kw.toLowerCase();
      hit = !l || e.eqp.toLowerCase().includes(l) || e.recipes.join(',').toLowerCase().includes(l);
    }
    const tHit = (tMin===null||e.temp>=tMin) && (tMax===null||e.temp<=tMax);
    return hit && (!state.fCap || e.cap===state.fCap) && tHit;
  });
}

function rowsHtml(rows, re){
  if(!rows.length) return '<tr><td colspan="6"><div class="empty">暂无匹配数据</div></td></tr>';
  return rows.map((e,i)=>{
    const start=(state.page-1)*PAGE_SIZE+i+1;
    const shown=e.recipes.slice(0,3), rest=e.recipes.length-shown.length;
    return `<tr>
      <td class="num">${start}</td>
      <td><b>${esc(e.eqp)}</b></td>
      <td><div class="recips">${shown.map(r=>{
        const wild=/[*?]/.test(r);
        const m=re&&re.test(r)&&!wild;
        const cls=wild?'wild':(m?'match':'');
        const title=wild?'通配模式配方（如 RCP_A* 表示所有 RCP_A 开头的配方）':'';
        return `<span class="tag ${cls}" title="${title}">${wild?'⊛ ':''}${hlRecipe(r,re)}</span>`;
      }).join('')}${rest>0?`<span class="more">+${rest}</span>`:''}</div></td>
      <td>${e.temp} ℃</td>
      <td><span class="tag processing">${e.cap}</span></td>
      <td><button class="btn link" onclick="openEquipModal('${esc(e.eqp)}')">修改</button></td>
    </tr>`;
  }).join('');
}

function pagerHTML(total,maxPage){
  if(total<=PAGE_SIZE) return `<div id="pagerBox" class="note" style="padding:12px 0 0">共 ${total} 条 · 单页展示</div>`;
  return `<div id="pagerBox" style="display:flex;align-items:center;gap:8px;padding:14px 0 0">
    <span class="note">共 ${total} 条 · 第 ${state.page}/${maxPage} 页</span>
    <span style="margin-left:auto;display:flex;gap:6px">
      <button class="btn sm" ${state.page<=1?'disabled':''} onclick="state.page--;refreshDisplayRows()">上一页</button>
      <button class="btn sm" ${state.page>=maxPage?'disabled':''} onclick="state.page++;refreshDisplayRows()">下一页</button>
    </span></div>`;
}
function refreshDisplayRows(){
  const host=$('#dspBody'); if(!host) return;
  const re=buildRe(state.kw.trim());
  const list=currentList(), total=list.length, maxPage=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(state.page>maxPage) state.page=maxPage;
  const rows=list.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE);
  host.innerHTML=rowsHtml(rows, re);
  const old=document.querySelector('#pagerBox'); if(old) old.remove();
  host.closest('table').insertAdjacentHTML('afterend', pagerHTML(total,maxPage));
  const rc=$('#rowCount');
  if(rc) rc.innerHTML=(re?`<span class="tag processing" style="margin-right:6px">通配 ${esc(state.kw.trim())}</span>`:'')+'<span class="note">共 '+total+' 条</span>';
}

function editCap(key){

    if(s>=e) return toast('TEM START 必须小于 TEM END',true);
  } else return toast('TEM START 与 TEM END 需同时填写或同时留空（留空=通配）',true);
  if(ct<=0) return toast('花费时间需大于 0',true);
  const c=D.caps.find(x=>capKey(x)===key);
  Object.assign(c,{start:s,end:e,cost:ct,ut:now().slice(0,16),uu:curUser});

function submitEquip(eqp){
  const id=$('#f_eqp').value.trim().toUpperCase();
  const raw=$('#f_recipes').value.trim();
  const t=parseInt($('#f_temp').value);
  const err=$('#f_err');
  if(!id) return err.textContent='请输入 EQUIP_ID';
  if(!raw) return err.textContent='请至少填写一个 RECIPE_ID';
  if(isNaN(t)||t<15||t>45) return err.textContent='TEMPERATURE 需为 15~45 之间的数字';
  const recipes=[...new Set(raw.split(/[,，;；|]/).map(s=>s.trim().toUpperCase()).filter(Boolean))];
  if(eqp){
    const e=D.equips.find(x=>x.eqp===eqp);
    Object.assign(e,{recipes,temp:t,src:'手工维护'});
    toast('已修改 '+eqp);

    if(D.equips.some(x=>x.eqp===id)) return err.textContent='EQUIP_ID 已存在，请通过「修改」维护';
    D.equips.push({eqp:id, cap:'Capability1', recipes, temp:t, src:'手工维护'});
    toast('已新增 '+id);
  }
  closeModal(); render();
}

  const body=`

    <div id="csvResult"></div>`;
  showModal('CSV 导入设备温层','<div>'+body+'</div>',
    `<button class="btn" onclick="downloadTpl()">下载模板</button>
     <span style="flex:1"></span>
     <button class="btn" onclick="closeModal()">取消</button>
     <button class="btn primary" id="csvOk" disabled onclick="confirmImport()">确认导入</button>`, true);
}

let csvParsed=[];
function parseCsv(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let txt=String(rd.result).replace(/^\uFEFF/,'');
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length) return $('#csvResult').innerHTML='<div class="err">文件为空</div>';
    const head=lines[0].toLowerCase();
    const startIdx = head.includes('equip')?1:0;
    csvParsed=[]; let bad=0;
    for(let i=startIdx;i<lines.length;i++){
      const cols=lines[i].split(',').map(s=>s.trim().replace(/^"|"$/g,''));
      const [id,rc,tp]=cols;
      const t=parseInt(tp);
      const ok=!!id && !!rc && !isNaN(t);
      if(!ok) bad++;
      csvParsed.push({eqp:(id||'').toUpperCase(), recipes:(rc||'').split(/[,，;；|]/).map(s=>s.trim().toUpperCase()).filter(Boolean),
        temp:t, ok});
    }
    const exist=csvParsed.filter(r=>r.ok && D.equips.some(x=>x.eqp===r.eqp)).length;
    const add=csvParsed.filter(r=>r.ok && !D.equips.some(x=>x.eqp===r.eqp)).length;
    $('#csvResult').innerHTML=`
      <div style="display:flex;gap:8px;margin:14px 0 8px;align-items:center">
        <span class="tag success">可导入 ${csvParsed.filter(r=>r.ok).length}</span>
        <span class="tag processing">新增 ${add}</span>
        <span class="tag warning">覆盖 ${exist}</span>
        ${bad?`<span class="tag error">异常行 ${bad}</span>`:''}
        <span class="note" style="margin-left:auto">${esc(f.name)}</span>
      </div>
      <div class="preview"><table class="tbl">
        <thead><tr><th>行</th><th>EQUIP_ID</th><th>RECIPE_ID_LIST</th><th>TEMPERATURE</th><th>校验</th></tr></thead>
        <tbody>${csvParsed.slice(0,20).map((r,i)=>`<tr>
          <td>${i+1}</td><td><b>${esc(r.eqp||'-')}</b></td>
          <td>${esc(r.recipes.join(', ')||'-')}</td>
          <td>${isNaN(r.temp)?'<span class="badge-err">-</span>':r.temp}</td>
          <td>${r.ok?'<span class="tag success">PASS</span>':(D.equips.some(x=>x.eqp===r.eqp)?'<span class="tag warning">WARN</span>':'<span class="tag error">FAIL</span>')}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      ${csvParsed.length>20?`<div class="hint">仅预览前 20 行，共 ${csvParsed.length} 行</div>`:''}
      ${bad?`<div class="hint" style="color:var(--colorError)">存在 ${bad} 行字段缺失或温度非法，导入时将自动跳过</div>`:''}`;
    $('#csvOk').disabled = csvParsed.filter(r=>r.ok).length===0;
  };
  rd.readAsText(f,'UTF-8');
}

function confirmImport(){
  let add=0, upd=0, skip=0;
  csvParsed.forEach(r=>{
    if(!r.ok){ skip++; return; }
    const ex=D.equips.find(x=>x.eqp===r.eqp);
    if(ex){ Object.assign(ex,{recipes:r.recipes,temp:r.temp,src:'CSV 导入'}); upd++; }
    else { D.equips.push({eqp:r.eqp, cap:'Capability1', recipes:r.recipes,temp:r.temp,src:'CSV 导入'}); add++; }
  });
  closeModal();
  toast(`导入完成：新增 ${add} 条，覆盖 ${upd} 条${skip?`，跳过 ${skip} 条`:''}`);
  D.sync.last=now();
  render();
}

let comboVal='', comboHl=-1;
function openCombo(){ $('#capList').classList.add('open'); }
function filterCombo(v){
  comboVal=v; comboHl=-1;
  const kw=v.trim().toLowerCase();
  [...document.querySelectorAll('#capList .combo-item')].forEach(el=>{
    el.style.display = !kw || el.dataset.v.toLowerCase().includes(kw) ? 'flex':'none';
  });
  const anyVisible=[...document.querySelectorAll('#capList .combo-item')].some(el=>el.style.display!=='none');
  let empty=$('#capList .combo-empty');
  if(!anyVisible){
    if(!empty){ $('#capList').insertAdjacentHTML('beforeend','<div class="combo-empty">无匹配的 Capability</div>'); }
  } else if(empty) empty.remove();
  openCombo();
}
function pickCombo(v){
  if(!v || v.dataset.dis) return;
  $('#capInput').value=v.dataset.v; comboVal=v.dataset.v;
  $('#capList').classList.remove('open');
}
function comboKey(e){
  const items=[...document.querySelectorAll('#capList .combo-item')].filter(el=>el.style.display!=='none'&&!el.dataset.dis);
  if(e.key==='ArrowDown'){ e.preventDefault(); comboHl=Math.min(items.length-1,comboHl+1); items.forEach((el,i)=>el.classList.toggle('hl',i===comboHl)); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); comboHl=Math.max(0,comboHl-1); items.forEach((el,i)=>el.classList.toggle('hl',i===comboHl)); }
  else if(e.key==='Enter'){ e.preventDefault(); if(items[comboHl]) pickCombo(items[comboHl]); }
  else if(e.key==='Escape'){ $('#capList').classList.remove('open'); }
}
document.addEventListener('click', e=>{
  const list=$('#capList'); if(!list) return;
  const item=e.target.closest('#capList .combo-item'); if(item){ pickCombo(item); return; }
  if(!e.target.closest('#comboCap')) list.classList.remove('open');
});

/* ================= 通用模糊搜索下拉（列表筛选用） ================= */
function ssHTML(id, value, items, placeholder){
  const opts = items.map(v=>`<div class="combo-item" data-v="${esc(v)}" onclick="ssPick('${id}','${esc(v)}')">${esc(v)}</div>`).join('');
  return `<div class="combo" id="${id}">
    <input class="inp" id="${id}_input" placeholder="${placeholder}" autocomplete="off" value="${esc(value)}"
      onfocus="ssOpen('${id}')" oninput="ssFilter('${id}',this.value)" onkeydown="ssKey(event,'${id}')">
    <span class="arrow">▾</span>
    <div class="combo-list" id="${id}_list">${opts}</div>
  </div>`;
}
function ssOpen(id){ const l=$('#'+id+'_list'); if(l) l.classList.add('open'); }
function ssFilter(id,v){
  const kw=v.trim().toLowerCase(); let any=false;
  [...document.querySelectorAll('#'+id+'_list .combo-item')].forEach(el=>{
    const show = !kw || el.dataset.v.toLowerCase().includes(kw);
    el.style.display = show?'flex':'none'; if(show) any=true;
  });
  const l=$('#'+id+'_list');
  let empty=l.querySelector('.combo-empty');
  if(!any){ if(!empty) l.insertAdjacentHTML('beforeend','<div class="combo-empty">无匹配</div>'); }
  else if(empty) empty.remove();
  ssOpen(id);
}
function ssPick(id,v){
  const inp=$('#'+id+'_input'); if(inp) inp.value=v;
  const l=$('#'+id+'_list'); if(l) l.classList.remove('open');
}
function ssKey(e,id){
  const items=[...document.querySelectorAll('#'+id+'_list .combo-item')].filter(el=>el.style.display!=='none');
  let hl=parseInt(($('#'+id).dataset.hl)||'-1');
  if(e.key==='ArrowDown'){ e.preventDefault(); hl=Math.min(items.length-1,hl+1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); hl=Math.max(0,hl-1); }
  else if(e.key==='Enter'){ e.preventDefault(); if(items[hl]) ssPick(id,items[hl].dataset.v); return; }
  else if(e.key==='Escape'){ const l=$('#'+id+'_list'); if(l) l.classList.remove('open'); return; }
  items.forEach((el,i)=>el.classList.toggle('hl',i===hl));
  $('#'+id).dataset.hl=hl;
}
document.addEventListener('click', e=>{
  document.querySelectorAll('.combo-list.open').forEach(l=>{
    if(!l.closest('.combo').contains(e.target)) l.classList.remove('open');
  });
});

function submitCap(){
  const cap=($('#capInput').value||'').trim();
  const ct=parseInt($('#c_cost').value);
  const err=$('#c_err');
  if(!cap) return err.textContent='请选择 Capability';
  if(!D.capMaster.includes(cap)) return err.textContent='Capability 不在可选值范围内';
  if(D.caps.some(c=>c.cap===cap)) return err.textContent='该 Capability 已配置，请直接编辑';
  const rawS=($('#c_start').value||'').trim(), rawE=($('#c_end').value||'').trim();
  let s=null, en=null;
  if(!rawS && !rawE){ s=null; en=null; }
  else if(rawS && rawE){ s=parseInt(rawS); en=parseInt(rawE);
    if(isNaN(s)||isNaN(en)) return err.textContent='TEM START / TEM END 需为数字（或同时留空=通配）';
    if(s>=en) return err.textContent='TEM START 必须小于 TEM END';
  } else return err.textContent='TEM START 与 TEM END 需同时填写或同时留空（留空=通配）';
  if(isNaN(ct)||ct<=0) return err.textContent='花费时间需为大于 0 的秒数';
  D.caps.push({cap,start:s,end:en,cost:ct,ut:now().slice(0,16),uu:curUser});
  closeModal(); toast('已新增配置：'+cap); render();
}

/* ===== Capability 温层 CSV 导入（TEM START/END 选填=通配；已存在按覆盖更新） ===== */
let capCsv=[];
function openCapImport(){
  const body='<div class="drop" onclick="document.getElementById(\'capCsvFile\').click()">'
    +'<div class="ic">📄</div>'
    +'<div class="m">点击选择 CSV 文件，或将文件拖拽到此处</div>'
    +'<div class="s">列顺序：CAPABILITY, TEM START, TEM END, 花费时间(s)（首行可为表头；TEM START/END 选填，同时留空=通配行）</div></div>'
    +'<input type="file" id="capCsvFile" accept=".csv,text/csv" style="display:none" onchange="parseCapCsv(this)">'
    +'<div class="hint" style="margin-top:10px">已存在 Capability 按<b>覆盖更新</b>处理；花费时间必填（>0 秒）。</div>'
    +'<div id="capCsvResult"></div>';
  showModal('CSV 导入 · Capability 温层配置','<div>'+body+'</div>',
    '<button class="btn" onclick="downloadCapTpl()">下载模板</button>'
    +'<span style="flex:1"></span>'
    +'<button class="btn" onclick="closeModal()">取消</button>'
    +'<button class="btn primary" id="capCsvOk" disabled onclick="confirmCapImport()">确认导入</button>', true);
}
function parseCapCsv(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let txt=String(rd.result).replace(/^\uFEFF/,'');
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    const box=document.getElementById('capCsvResult');
    if(!lines.length){ box.innerHTML='<div class="err">文件为空</div>'; return; }
    const startIdx=lines[0].toLowerCase().includes('capabilit')?1:0;
    capCsv=[]; let bad=0;
    for(let i=startIdx;i<lines.length;i++){
      const cols=lines[i].split(',').map(x=>x.trim().replace(/^"|"$/g,''));
      const cap=(cols[0]||'').toUpperCase(), rawS=cols[1]||'', rawE=cols[2]||'', ct=parseInt(cols[3]);
      let st=null, en=null, ok=!!cap && !isNaN(ct) && ct>0;
      if(rawS&&rawE){ st=parseInt(rawS); en=parseInt(rawE); if(isNaN(st)||isNaN(en)||st>=en) ok=false; }
      else if(rawS||rawE){ ok=false; }
      if(!ok) bad++;
      capCsv.push({cap:cap,start:st,end:en,cost:ct,ok:ok});
    }
    const exist=capCsv.filter(r=>r.ok&&D.caps.some(x=>x.cap===r.cap)).length;
    const add=capCsv.filter(r=>r.ok&&!D.caps.some(x=>x.cap===r.cap)).length;
    const okN=capCsv.filter(r=>r.ok).length;
    let h='<div style="display:flex;gap:8px;margin:14px 0 8px;align-items:center">'
      +'<span class="tag success">可导入 '+okN+'</span>'
      +'<span class="tag processing">新增 '+add+'</span>'
      +'<span class="tag warning">覆盖 '+exist+'</span>'
      +(bad?'<span class="tag error">异常行 '+bad+'</span>':'')
      +'<span class="note" style="margin-left:auto">'+esc(f.name)+'</span></div>'
      +'<div class="preview"><table class="tbl"><thead><tr><th>行</th><th>Capability</th><th>TEM START</th><th>TEM END</th><th>花费时间(s)</th><th>校验</th></tr></thead><tbody>';
    capCsv.slice(0,20).forEach(function(r,i){
      h+='<tr><td>'+(i+1)+'</td><td><b>'+esc(r.cap||'-')+'</b></td>'
        +'<td>'+(r.start==null?'<span class="note">通配</span>':r.start)+'</td>'
        +'<td>'+(r.end==null?'<span class="note">通配</span>':r.end)+'</td>'
        +'<td>'+(isNaN(r.cost)?'<span class="badge-err">-</span>':r.cost)+'</td>'
        +'<td>'+(r.ok?'<span class="tag success">PASS</span>':'<span class="tag error">FAIL</span>')+'</td></tr>';
    });
    h+='</tbody></table></div>'
      +(capCsv.length>20?'<div class="hint">仅预览前 20 行，共 '+capCsv.length+' 行</div>':'')
      +(bad?'<div class="hint" style="color:var(--colorError)">存在 '+bad+' 行字段缺失或数值非法，导入时将自动跳过</div>':'');
    box.innerHTML=h;
    document.getElementById('capCsvOk').disabled=okN===0;
  };
  rd.readAsText(f,'UTF-8');
}
function confirmCapImport(){
  let add=0, upd=0, skip=0;
  capCsv.forEach(function(r){
    if(!r.ok){ skip++; return; }
    const ex=D.caps.find(x=>x.cap===r.cap);
    if(ex){ Object.assign(ex,{start:r.start,end:r.end,cost:r.cost,ut:now().slice(0,16),uu:curUser}); upd++; }
    else { D.caps.push({cap:r.cap,start:r.start,end:r.end,cost:r.cost,ut:now().slice(0,16),uu:curUser}); add++; }
  });
  closeModal();
  toast('导入完成：新增 '+add+' 条，覆盖 '+upd+' 条'+(skip?'，跳过 '+skip+' 条':''));
  render();
}
function downloadCapTpl(){
  const csv='CAPABILITY,TEM START,TEM END,花费时间(s)\nCapability5,105,125,140\nCapability6,,,80\n';
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='capability_temp_template.csv'; a.click();
  toast('模板已下载');
}

/* ================= 通用弹窗 ================= */
function showModal(title, body, footer, wide){
  $('#modalRoot').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal ${wide?'wide':''}">
        <div class="modal-h"><span class="t">${esc(title)}</span><span class="x" onclick="closeModal()">✕</span></div>
        <div class="modal-b">${body}</div>
        <div class="modal-f">${footer}</div>
      </div>
    </div>`;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }

/* ================= 评论模式 ================= */
function bindTips(){
  document.querySelectorAll('.q').forEach(el=>{
    el.onclick=ev=>{
      ev.stopPropagation();
      document.querySelectorAll('.bubble').forEach(b=>b.remove());
      const b=document.createElement('div');
      b.className='bubble';
      b.innerHTML='<div class="bt">字段说明</div><div class="bd">'+esc(el.dataset.tip)+'</div>';
      document.body.appendChild(b);
      const r=el.getBoundingClientRect();
      b.style.left=Math.min(window.innerWidth-320, r.left)+'px';
      b.style.top=(r.bottom+8)+'px';
      setTimeout(()=>document.addEventListener('click',()=>b.remove(),{once:true}),0);
    };
  });
}

/* ================= 启动 ================= */
$('#cmtBtn').onclick=()=>{
  state.cmt=!state.cmt;
  document.body.classList.toggle('cmt-on', state.cmt);
  $('#cmtBtn').classList.toggle('primary', state.cmt);
  if(state.cmt) bindTips();
};
function clock(){ $('#clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false}); }
render(); clock(); setInterval(clock,1000);
</script>
