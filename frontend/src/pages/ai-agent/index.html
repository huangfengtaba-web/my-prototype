<!doctype html>
<!-- GTX FSO Litho · AI 助手页 ai-agent · v1 · 2026-10-29
     对话式排程助手：LLM function calling（可配置）或规则模式（无 Key 兜底），可触发任意工具。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTX FSO Litho · AI 助手 Agent</title>
<link rel="stylesheet" href="../_shared/shell.css">
<style>
.chat-card{flex:1;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px;min-height:320px}
.msg{max-width:78%;padding:10px 14px;border-radius:var(--radiusLG);font-size:13px;line-height:1.7;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--colorPrimary);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#FAFAFA;border:1px solid var(--colorBorderSecondary);border-bottom-left-radius:4px}
.toolchip{align-self:flex-start;display:flex;gap:8px;align-items:center;max-width:78%;
  background:var(--primaryBg);border:1px solid var(--primaryBorder);border-radius:var(--radius);
  padding:6px 12px;font-size:12px;color:var(--colorPrimary)}
.toolchip .tname{font-weight:600}
.toolchip .tsum{color:var(--colorTextSecondary)}
.inputbar{display:flex;gap:10px;padding-top:12px;border-top:1px solid var(--colorBorderSecondary);margin-top:8px}
.inputbar textarea{flex:1;resize:none;height:64px;padding:10px 12px;border:1px solid var(--colorBorder);
  border-radius:var(--radius);font-family:var(--font);font-size:13px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick button{font-size:12px;padding:3px 10px;border:1px solid var(--colorBorder);border-radius:999px;
  background:#fff;cursor:pointer;color:var(--colorTextSecondary)}
.quick button:hover{border-color:var(--colorPrimaryHover);color:var(--colorPrimaryHover)}
.mode-badge{font-size:12px;padding:2px 10px;border-radius:999px}
.mode-badge.llm{background:var(--successBg);color:var(--colorSuccess);border:1px solid var(--successBorder)}
.mode-badge.rule{background:var(--warningBg);color:var(--colorWarning);border:1px solid var(--warningBorder)}
</style>
</head>
<body>
<div class="app">
  <aside class="sider" id="sider"></aside>
  <div class="main">
    <header class="header">
      <div class="crumb">Model Control / <b>AI 助手 Agent</b></div>
      <div class="right"><span id="clock" class="clock"></span>
        <span id="modeBadge" class="mode-badge rule">检测中…</span>
        <button id="cmBtn" class="btn sm">💬 评论模式</button></div>
    </header>
    <div class="content chat-card">
      <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0">
        <div class="card-h">
          <div><div class="t">排程 AI 助手</div>
            <div class="sub">可用工具：求解 / 仿真 / 工作流 / 数据查询 —— 让它"跑一下 urgent-A01"试试</div></div>
          <span class="q" data-cm="LLM 模式：配置 LLM_API_BASE/LLM_API_KEY/LLM_MODEL 后走 function calling，模型自主决策调工具；规则模式：无 Key 时按关键词路由，见 backend/app/agent/agent.py。">?</span>
        </div>
        <div class="msgs" id="msgs">
          <div class="msg bot">你好！我是排程 AI 助手。我可以直接帮你跑求解、做仿真、执行工作流、查数据。试试下面的快捷提问。</div>
        </div>
        <div class="quick" id="quick"></div>
        <div class="inputbar">
          <textarea id="input" placeholder="例如：跑一下 urgent-A01 看看急货排得怎么样（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="sendBtn" class="btn primary">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="tt" class="tt"></div>
<script type="module" src="./script.js"></script>
</body>
</html>
